spring.profiles.active=test
spring.main.allow-bean-definition-overriding=true
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

spring.jwt.secret=${JWT_SECRET:9a2f8c4e1b7d5a3f6e9c2b8a5d1e4f7a9c2b8a5d1e4f7a9c2b8a5d1e4f7a9c2b}
spring.jwt.accessTokenExpiration=300
spring.jwt.refreshTokenExpiration=604800

root.user.email=${ROOT_USER_EMAIL:root@example.com}
root.user.password=${ROOT_USER_PASSWORD:RootPassword123!}

spring.cache.type=caffeine

