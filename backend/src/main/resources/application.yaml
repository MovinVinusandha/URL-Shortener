spring:
  application:
    name: url-shortener
  jwt:
    secret: ${JWT_SECRET}
    accessTokenExpiration: 300  # 5m
    refreshTokenExpiration: 604800  # 7d
    rootAdminEmail: ${ROOT_ADMIN_EMAIL}
    rootAdminPassword: ${ROOT_ADMIN_PASSWORD}
  profiles:
    active: dev

# Async thread pool configuration for click analytics
analytics:
  async:
    core-pool-size: 4
    max-pool-size: 16
    queue-capacity: 500