spring:
  application:
    name: url-shortener
  jwt:
    secret: ${JWT_SECRET}
    accessTokenExpiration: 300  # 5m
    refreshTokenExpiration: 604800  # 7d
  profiles:
    active: dev

root:
  user:
    email: ${ROOT_USER_EMAIL}
    password: ${ROOT_USER_PASSWORD}

# Async thread pool configuration for click analytics
analytics:
  async:
    core-pool-size: 4
    max-pool-size: 16
    queue-capacity: 500

app:
  domain:
    root: ${ROOT_DOMAIN_URL:http://localhost:8080}
  frontend:
    url: ${FRONTEND_URL:http://localhost}
  cors:
    allowed-origins: ${APP_DOMAIN_URL:http://localhost:5173,http://localhost}