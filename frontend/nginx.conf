server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # CRITICAL FIX: Explicitly serve index.html locally to prevent proxy loops!
    location = /index.html {
        try_files /index.html =404;
    }

    # 1. API and Auth requests go directly to Spring Boot
    location ~ ^/(api|auth)/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 2. Known Frontend Routes (React SPA)
    location ~ ^/(dashboard|analytics|folders|tags|settings|login|register|expired) {
        try_files $uri $uri/ /index.html;
    }

    # 3. Static assets
    location ~ ^/(assets|images|.*\.(svg|png|jpg|jpeg|ico|css|js))$ {
        try_files $uri =404;
    }

    # 4. Everything else is assumed to be a short link! Send to backend.
    location / {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # If backend says 404 (short link not found), fallback to React
        proxy_intercept_errors on;
        error_page 404 = /index.html;
    }
}