server {
    listen 80;
    server_name localhost;

    client_max_body_size 10M;

    # 1. FRONTEND ROUTING (/login, /dashboard, etc.)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. AUTH ENDPOINTS (/auth/login, /auth/refresh, /auth/me)
    location /auth {
        proxy_pass http://url_shortener_backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. USER ENDPOINTS (/user, /user/all, /user/{id})
    location /user {
        proxy_pass http://url_shortener_backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. SHORTEN ENDPOINT (POST /shorten)
    location /shorten {
        proxy_pass http://url_shortener_backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. URL MANAGEMENT ENDPOINTS (/url/{hash}, /url/all)
    location /url {
        proxy_pass http://url_shortener_backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}