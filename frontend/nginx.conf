server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 1. API & Auth -> Spring Boot
    location ~ ^/(api|auth)/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 1.5 Exact Root (Landing Page) -> React
    location = / {
        try_files /index.html =404;
    }

    # 2. React SPA Routes (Exact matches and their sub-paths)
    location ~ ^/(dashboard|analytics|folders|tags|settings|login|register|expired)(/.*)?$ {
        try_files $uri $uri/ @react;
    }

    # 3. Static Assets
    location ~ \.(svg|png|jpg|jpeg|ico|css|js|json|txt|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
    }

    # 4. React Fallback Named Location
    location @react {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # 5. Everything else is assumed to be a short link
    location / {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_intercept_errors on;
        error_page 404 400 = @react;
    }
}
