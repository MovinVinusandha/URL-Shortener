server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 1. API & Auth -> Spring Boot
    location ~ ^/(api|auth)/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 2. Exact Root (Landing Page) -> React
    location = / {
        try_files /index.html =404;
    }

    # 3. Known React SPA Routes -> React
    location ~ ^/(dashboard|analytics|folders|tags|settings|login|register|expired) {
        try_files $uri $uri/ /index.html;
    }

    # 4. Static Assets -> React
    location ~ ^/(assets|images|.*\.(svg|png|jpg|jpeg|ico|css|js))$ {
        try_files $uri =404;
    }

    # 5. Everything Else (Short Links) -> Spring Boot
    location / {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_intercept_errors on;
        error_page 404 = /index.html; # Fallback to React if short link not found
    }
}